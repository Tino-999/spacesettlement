<!-- library.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Index — Space Settlement</title>
  <meta name="description" content="People, projects, organizations, and topics advancing space settlement." />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="bg">
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="index.html">SPACESETTLEMENT</a>
      <nav class="nav">
        <a class="nav__link is-active" href="library.html">Index</a>
        <a class="brand" href="admin.html">Admin</a>
        <a class="nav__link" href="pages/about.html">About</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <section class="page__intro">
      <h1 class="page__title">Index</h1>
      <p class="page__lead">A visual, monochrome list. Titles link out. Text lives in the fade.</p>

      <div class="controls">
        <input
          id="q"
          class="input"
          type="search"
          placeholder="search…"
          autocomplete="off"
        />

	<div class="chips" role="list" aria-label="Filters">
  		<button class="chip" data-filter="projects" type="button">projects</button>
  		<button class="chip" data-filter="fiction" type="button">fiction</button>
  		<button class="chip" data-filter="orgs" type="button">orgs</button>
  		<button class="chip" data-filter="people" type="button">people</button>
  		<button class="chip" data-filter="topics" type="button">topics</button>
  		<button class="chip" data-filter="books" type="button">books</button>
  		<button class="chip" data-filter="movies" type="button">movies</button>
  		<button class="chip" data-filter="concepts" type="button">concepts</button>
  		<button class="chip is-active" data-filter="all" type="button">all</button>
	</div>
  <div class="chips chips-sub" role="list" aria-label="Project Classes">
  <button class="chip" data-project-class="I" type="button">class I</button>
  <button class="chip" data-project-class="II" type="button">class II</button>
  <button class="chip" data-project-class="III" type="button">class III</button>
  <button class="chip" data-project-class="IV" type="button">class IV</button>
  <button class="chip" data-project-class="V" type="button">class V</button>
  </div>
  <div class="chips chips-sub" role="list" aria-label="Fiction Classes">
  <button class="chip" data-fiction-class="A" type="button">class A</button>
  <button class="chip" data-fiction-class="B" type="button">class B</button>
  <button class="chip" data-fiction-class="C" type="button">class C</button>
  <button class="chip" data-fiction-class="D" type="button">class D</button>
  </div>
      </div>
    </section>

    <section id="cards" class="stack" aria-live="polite"></section>

    <footer class="footer">
      <div class="footer__inner">
        <span>© <span id="year"></span> Space Settlement Index</span>
        <span class="sep">·</span>
        <a class="footer__link" href="index.html">Landing</a>
        <span class="sep">·</span>
        <a class="footer__link" href="pages/about.html">About</a>
      </div>
    </footer>
  </main>

  <script defer src="assets/js/app.js"></script>
</body>
</html>
