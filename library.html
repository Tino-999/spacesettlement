<!-- library.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Index — Space Settlement</title>
  <meta name="description" content="People, projects, art, and topics advancing space settlement." />
  <link rel="stylesheet" href="assets/css/styles.css" />

<style>
[data-tooltip] { position: relative; }
[data-tooltip]::after {
  content: attr(data-tooltip);
  position: absolute;
  left: 0;
  top: 100%;
  margin-top: 0.4rem;
  padding: 0.4rem 0.6rem;
  max-width: 20rem;
  background: rgba(30, 30, 30, 0.92) !important;
  color: #e0e0e0 !important;
  border: 1px solid rgba(255,255,255,0.12) !important;
  font-size: 0.85rem;
  line-height: 1.2;
  border-radius: 0.4rem;
  opacity: 0;
  pointer-events: none;
  transform: translateY(-4px);
  transition: opacity 120ms ease, transform 120ms ease;
  z-index: 1000;
}
[data-tooltip]:hover::after,
.tooltip-active[data-tooltip]::after {
  opacity: 1;
  transform: translateY(0);
}
</style>

</head>

<body class="bg">
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="index.html">SPACESETTLEMENT</a>
      <nav class="nav">
        <a class="nav__link is-active" href="library.html">Index</a>
        <a class="nav__link" href="pages/about.html">About</a>
        <a href="#" id="lang-toggle" class="nav__link">DE</a>
    </div>
  </header>

  <main class="page">
    <section class="page__intro">
      <h1 class="page__title">Index</h1>

      <div class="controls">
        <input id="q" class="input" type="search" placeholder="search…" autocomplete="off" />

        <div class="chips" role="list" aria-label="Filters">
          <button class="chip" data-filter="projects" type="button">projects</button>
          <button class="chip" data-filter="fiction" type="button">fiction</button>
          <button class="chip" data-filter="topics" type="button">topics</button>
          <button class="chip" data-filter="art" type="button">art</button>
          <button class="chip" data-filter="people" type="button">people</button>
          <button class="chip" data-filter="books" type="button">books</button>
          <button class="chip" data-filter="movies" type="button">movies</button>
          <button class="chip is-active" data-filter="all" type="button">all</button>
        </div>

        <div id="project-classes" class="chips chips-sub" hidden></div>
        <div id="fiction-classes" class="chips chips-sub" hidden></div>
        <div id="topic-classes" class="chips chips-sub" hidden></div>
      </div>
    </section>

    <section id="cards" class="stack"></section>
  </main>

  <script defer src="assets/js/app.js"></script>
</body>
</html>
