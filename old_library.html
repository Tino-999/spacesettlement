<!-- library.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Index — Space Settlement</title>
  <meta name="description" content="People, projects, organizations, and topics advancing space settlement." />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>

<body class="bg">
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="index.html">SPACESETTLEMENT</a>
      <nav class="nav">
        <a class="nav__link is-active" href="library.html">Index</a>
        <a class="nav__link" href="admin.html">Admin</a>
        <a class="nav__link" href="pages/about.html">About</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <section class="page__intro">
      <h1 class="page__title">Index</h1>
      <p class="page__lead">
        A visual, monochrome list. Titles link out. Text lives in the fade.
      </p>

      <div class="controls">
        <input
          id="q"
          class="input"
          type="search"
          placeholder="search…"
          autocomplete="off"
        />

        <!-- MAIN TYPE FILTERS -->
        <div class="chips" role="list" aria-label="Filters">
          <button class="chip" data-filter="projects" type="button">projects</button>
          <button class="chip" data-filter="fiction" type="button">fiction</button>
          <button class="chip" data-filter="topics" type="button">topics</button>
          <button class="chip" data-filter="orgs" type="button">orgs</button>
          <button class="chip" data-filter="people" type="button">people</button>
          <button class="chip" data-filter="books" type="button">books</button>
          <button class="chip" data-filter="movies" type="button">movies</button>
          <button class="chip" data-filter="concepts" type="button">concepts</button>
          <button class="chip is-active" data-filter="all" type="button">all</button>
        </div>

        <!-- PROJECT CLASSES -->
        <div
          id="project-classes"
          class="chips chips-sub"
          role="list"
          aria-label="Project Classes"
          hidden
        >
          <button class="chip" data-project-class="CLASS I" type="button">class I</button>
          <button class="chip" data-project-class="CLASS II" type="button">class II</button>
          <button class="chip" data-project-class="CLASS III" type="button">class III</button>
          <button class="chip" data-project-class="CLASS IV" type="button">class IV</button>
          <button class="chip" data-project-class="CLASS V" type="button">class V</button>
        </div>

        <!-- FICTION CLASSES -->
        <div
          id="fiction-classes"
          class="chips chips-sub"
          role="list"
          aria-label="Fiction Classes"
          hidden
        >
          <button class="chip" data-fiction-class="CLASS A" type="button">class A</button>
          <button class="chip" data-fiction-class="CLASS B" type="button">class B</button>
          <button class="chip" data-fiction-class="CLASS C" type="button">class C</button>
          <button class="chip" data-fiction-class="CLASS D" type="button">class D</button>
        </div>

        <!-- TOPIC GROUPS -->
        <div
          id="topic-classes"
          class="chips chips-sub"
          role="list"
          aria-label="Topic Groups"
          hidden
        >
          <button class="chip" data-topic="LAW" type="button">law</button>
          <button class="chip" data-topic="RELIGION" type="button">religion</button>
          <button class="chip" data-topic="SETTLEMENT ARCHITECTURES" type="button">
            settlement architectures
          </button>
        </div>
      </div>
    </section>

    <!-- RESULT CARDS -->
    <section id="cards" class="stack" aria-live="polite"></section>

    <footer class="footer">
      <div class="footer__inner">
        <span>© <span id="year"></span> Space Settlement Index</span>
        <span class="sep">·</span>
        <a class="footer__link" href="index.html">Landing</a>
        <span class="sep">·</span>
        <a class="footer__link" href="pages/about.html">About</a>
      </div>
    </footer>
  </main>

  <script defer src="assets/js/app.js"></script>
</body>
</html>
